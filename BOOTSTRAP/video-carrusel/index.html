<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <h2 class="align-center">Carrusel de vídeos</h2>
<div id="carouselExampleCaptions" class="carousel slide">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <video class="d-block w-100" autoplay muted loop>
        <source src="video/Tropical.mp4" type="video/mp4">
      </video>
      <div class="carousel-caption d-none d-md-block">
        <h5>Primer vídeo</h5>
        <p>Descripción del primer vídeo</p>
      </div>
    </div>
    <div class="carousel-item">
      <video class="d-block w-100" autoplay muted loop>
        <source src="video/forest.mp4" type="video/mp4">
      </video>
      <div class="carousel-caption d-none d-md-block">
        <h5>Segundo vídeo</h5>
        <p>Descripción del segundo vídeo</p>
      </div>
    </div>
    <div class="carousel-item">
      <video class="d-block w-100" autoplay muted loop>
        <source src="video/Agua-natural.mp4" type="video/mp4">
      </video>
      <div class="carousel-caption d-none d-md-block">
        <h5>Tercer vídeo</h5>
        <p>Descripción del Tercer vídeo</p>
      </div>
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
